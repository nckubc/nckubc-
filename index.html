<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成大乙棒 - 捷徑儀表板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for minimal icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            50: '#fcfbf9',
                            100: '#f5f2eb',
                            200: '#e8e2d5',
                            300: '#d9cdbd',
                            400: '#bfae99',
                            500: '#a38f77',
                            600: '#87735c',
                            700: '#6c5a47',
                            800: '#544738',
                            900: '#42382c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f5f2eb;
            color: #544738;
        }
        .shortcut-btn {
            transition: all 0.2s ease;
        }
        .shortcut-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px -4px rgba(84, 71, 56, 0.08);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between selection:bg-pastel-300 antialiased">

    <main class="w-full max-w-xl mx-auto px-4 py-10 sm:py-16 flex flex-col flex-grow">
        
        <!-- Header: 成大乙棒 at the very top -->
        <div class="flex items-center justify-between mb-8 pb-4 border-b border-pastel-200">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-pastel-800 text-pastel-100 flex items-center justify-center shadow-xs">
                    <i class="fa-solid fa-baseball text-sm"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-pastel-900">成大乙棒</h1>
                    <p id="auth-status" class="text-xs text-pastel-500">雲端同步連線中...</p>
                </div>
            </div>
            
            <button onclick="openModal()" class="inline-flex items-center space-x-2 bg-pastel-800 hover:bg-pastel-900 text-pastel-100 px-4 py-2.5 rounded-2xl text-sm font-medium shadow-sm transition-all transform active:scale-95">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>新增捷徑</span>
            </button>
        </div>

        <!-- Vertical List of Shortcut Buttons -->
        <div id="shortcuts-list" class="flex flex-col space-y-3.5 flex-grow">
            <!-- Loading skeleton -->
            <div class="py-12 text-center text-pastel-500 space-y-2">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-pastel-400"></i>
                <p class="text-sm">載入雲端捷徑中...</p>
            </div>
        </div>

    </main>

    <footer class="w-full py-6 text-center text-xs text-pastel-500 border-t border-pastel-200 bg-pastel-100/50">
        <p>成大乙棒 &bull; 獨立捷徑清單 (Firebase Cloud)</p>
    </footer>

    <!-- Modal Form for Add/Edit -->
    <div id="shortcut-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-pastel-900/30 backdrop-blur-xs hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-md w-full mx-4 p-6 shadow-2xl border border-pastel-200 transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="flex items-center justify-between pb-4 border-b border-pastel-100">
                <h3 id="modal-title" class="text-lg font-bold text-pastel-900">新增捷徑</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-pastel-100 hover:bg-pastel-200 text-pastel-700 flex items-center justify-center transition-all">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="shortcut-form" onsubmit="saveShortcut(event)" class="space-y-4 pt-4">
                <input type="hidden" id="edit-id" value="">
                <div>
                    <label class="block text-xs font-semibold text-pastel-700 uppercase tracking-wider mb-1.5">按鈕名稱</label>
                    <input type="text" id="site-name" required placeholder="例如：球隊雲端硬碟、聯盟賽程" class="w-full px-4 py-3 rounded-xl border border-pastel-200 bg-pastel-50/50 text-sm text-pastel-900 focus:outline-none focus:ring-2 focus:ring-pastel-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-pastel-700 uppercase tracking-wider mb-1.5">網址 (URL)</label>
                    <input type="url" id="site-url" required placeholder="https://example.com" class="w-full px-4 py-3 rounded-xl border border-pastel-200 bg-pastel-50/50 text-sm text-pastel-900 focus:outline-none focus:ring-2 focus:ring-pastel-400">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-medium bg-pastel-100 hover:bg-pastel-200 text-pastel-700 transition-all">取消</button>
                    <button type="submit" id="save-btn" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-pastel-800 hover:bg-pastel-900 text-pastel-100 transition-all shadow-sm">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Modal for Alerts -->
    <div id="custom-alert" class="fixed inset-0 z-50 flex items-center justify-center bg-pastel-900/30 backdrop-blur-xs hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full mx-4 p-6 shadow-2xl border border-pastel-200 text-center space-y-4">
            <h4 id="alert-title" class="font-bold text-pastel-900 text-base">提示</h4>
            <p id="alert-message" class="text-sm text-pastel-600"></p>
            <button onclick="closeAlert()" class="w-full py-2.5 rounded-xl bg-pastel-800 text-pastel-100 text-sm font-medium hover:bg-pastel-955">確定</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMA4lZCVko9zmwIAh7vThiE7-kVeuPC4U",
            authDomain: "ncku-e580d.firebaseapp.com",
            projectId: "ncku-e580d",
            storageBucket: "ncku-e580d.firebasestorage.app",
            messagingSenderId: "254676639859",
            appId: "1:254676639859:web:e08f02ed33d6d9d938ca06",
            measurementId: "G-P5R5GJTH19"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ncku-baseball-shortcuts';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let shortcuts = [];
        let unsubscribe = null;

        window.showAlert = function(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('custom-alert').classList.remove('hidden');
        }

        window.closeAlert = function() {
            document.getElementById('custom-alert').classList.add('hidden');
        }

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
                await signInAnonymously(auth);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) return;
            document.getElementById('auth-status').innerText = "雲端同步已連線";
            
            // RULE 1: Public shared collection path
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'shortcuts');
            
            if (unsubscribe) unsubscribe();

            unsubscribe = onSnapshot(colRef, (snapshot) => {
                shortcuts = [];
                snapshot.forEach((docSnap) => {
                    shortcuts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderShortcuts();
            }, (error) => {
                console.error("Firestore snapshot error:", error);
                showAlert("同步錯誤", "無法即時同步雲端資料，請稍後再試。");
            });
        });

        initAuth();

        // Render shortcuts vertical list
        window.renderShortcuts = function() {
            const container = document.getElementById('shortcuts-list');
            
            if (shortcuts.length === 0) {
                container.innerHTML = `
                    <div class="py-20 text-center text-pastel-500 space-y-3">
                        <i class="fa-regular fa-folder-open text-3xl text-pastel-400"></i>
                        <p class="text-sm">目前尚無捷徑，點擊右上角「新增捷徑」開始建立吧！</p>
                    </div>
                `;
                return;
            }

            let html = '';
            shortcuts.forEach((item) => {
                const domain = getDomain(item.url);
                html += `
                    <div class="shortcut-btn bg-white border border-pastel-200/80 rounded-2xl p-4 flex items-center justify-between shadow-xs group">
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-3.5 flex-grow min-w-0 pr-4">
                            <div class="w-10 h-10 rounded-xl bg-pastel-100 text-pastel-800 font-bold flex items-center justify-center flex-shrink-0 shadow-2xs overflow-hidden">
                                <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=64" alt="" class="w-5 h-5 object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <span style="display:none;" class="text-xs">${item.name.charAt(0)}</span>
                            </div>
                            <div class="min-w-0">
                                <h2 class="font-bold text-sm sm:text-base text-pastel-900 truncate group-hover:text-pastel-600 transition-colors">${item.name}</h2>
                                <p class="text-xs text-pastel-500 truncate mt-0.5">${domain}</p>
                            </div>
                        </a>
                        <div class="flex items-center space-x-1 flex-shrink-0 opacity-80 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="editShortcut('${item.id}')" title="編輯" class="w-8 h-8 rounded-xl bg-pastel-50 hover:bg-pastel-100 text-pastel-700 flex items-center justify-center text-xs transition-all">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteShortcut('${item.id}')" title="刪除" class="w-8 h-8 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 flex items-center justify-center text-xs transition-all">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function getDomain(url) {
            try {
                const parsed = new URL(url);
                return parsed.hostname;
            } catch (e) {
                return url;
            }
        }

        // Modal Controls
        window.openModal = function() {
            document.getElementById('modal-title').innerText = '新增捷徑';
            document.getElementById('edit-id').value = '';
            document.getElementById('shortcut-form').reset();
            const modal = document.getElementById('shortcut-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-content').classList.remove('scale-95');
            }, 10);
        }

        window.editShortcut = function(id) {
            const item = shortcuts.find(s => s.id === id);
            if (!item) return;
            document.getElementById('modal-title').innerText = '編輯捷徑';
            document.getElementById('edit-id').value = id;
            document.getElementById('site-name').value = item.name;
            document.getElementById('site-url').value = item.url;
            
            const modal = document.getElementById('shortcut-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-content').classList.remove('scale-95');
            }, 10);
        }

        window.closeModal = function() {
            const modal = document.getElementById('shortcut-modal');
            modal.classList.add('opacity-0');
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        window.saveShortcut = async function(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('site-name').value.trim();
            let url = document.getElementById('site-url').value.trim();

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'shortcuts');

            try {
                if (!auth.currentUser) {
                    showAlert("提示", "尚未完成驗證，請稍候再試。");
                    return;
                }

                if (editId === '') {
                    await addDoc(colRef, { name, url, createdAt: Date.now() });
                } else {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shortcuts', editId);
                    await updateDoc(docRef, { name, url });
                }
                closeModal();
            } catch (err) {
                console.error("Save error:", err);
                showAlert("儲存失敗", "無法儲存至雲端資料庫，請檢查網路連線。");
            }
        }
